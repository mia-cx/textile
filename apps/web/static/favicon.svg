<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Textile</title>
  <style>
    .cloth { fill: #f5f0e6 }
    .warp { fill: #2c3b94 }
    .weft { fill: #c4472e }
    @media (prefers-color-scheme: dark) {
      .cloth { fill: #141a3e }
      .warp { fill: #aab8ff }
      .weft { fill: #e8735a }
    }
  </style>
  <rect class="cloth" width="32" height="32" rx="7"/>
  <!-- Plain weave: three weft rows and three warp columns, each passing over and under in turn. -->
  <g class="weft">
    <rect x="3" y="4" width="26" height="7.3"/>
    <rect x="3" y="12.35" width="26" height="7.3"/>
    <rect x="3" y="20.7" width="26" height="7.3"/>
  </g>
  <g class="warp">
    <rect x="4" y="3" width="7.3" height="26"/>
    <rect x="12.35" y="3" width="7.3" height="26"/>
    <rect x="20.7" y="3" width="7.3" height="26"/>
  </g>
  <g class="weft">
    <rect x="4" y="4" width="7.3" height="7.3"/>
    <rect x="20.7" y="4" width="7.3" height="7.3"/>
    <rect x="12.35" y="12.35" width="7.3" height="7.3"/>
    <rect x="4" y="20.7" width="7.3" height="7.3"/>
    <rect x="20.7" y="20.7" width="7.3" height="7.3"/>
  </g>
</svg>
