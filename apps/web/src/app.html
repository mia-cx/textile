<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The colour mode the docs' toggle stored, pinned before first paint so the site matches the docs. -->
    <script>
      (() => { try { const m = localStorage.getItem('svartz:color-mode'); if (m === 'light' || m === 'dark') document.documentElement.classList.add(m) } catch {} })()
    </script>
    <!-- The trefoil, rendered by `pnpm logo` (scripts/logo.ts). -->
    <link rel="icon" href="/icons/32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
